name: Push Change Report

# On every push to any branch, generate a colorful HTML report explaining the
# pushed changes (plain-English + technical) and commit it back into the repo at
# html_reports/<github-username>/<short-sha>/. See .github/scripts/ for the generator.
#
# `paths-ignore` on html_reports/** stops the report commit from re-triggering
# this workflow (otherwise it would loop on its own bot commit).

on:
  push:
    paths-ignore:
      - "html_reports/**"
  workflow_dispatch:

permissions:
  contents: write

# Serialize per branch so the commit-back can't race another run on the same
# branch; different branches still run in parallel.
concurrency:
  group: push-report-${{ github.ref }}
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (full history for diffing)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # persist-credentials (default true) lets the job push the report back.

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: .github/scripts/requirements.txt

      - name: Install report deps
        run: pip install -r .github/scripts/requirements.txt

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Claude Code CLI
        # Used for subscription auth (CLAUDE_CODE_OAUTH_TOKEN). Harmless if only
        # the API key is configured — the generator just won't use the CLI path.
        run: npm install -g @anthropic-ai/claude-code

      - name: Compute report identifiers
        id: vars
        # Path is keyed by IST push date/time then commit hash. The runner clock
        # is UTC, so convert with TZ=Asia/Kolkata. ':' is illegal in paths, so the
        # time uses dashes (HH-MM-SS).
        run: |
          IST_DATE=$(TZ='Asia/Kolkata' date +%F)         # e.g. 2026-05-23
          IST_TIME=$(TZ='Asia/Kolkata' date +%H-%M-%S)   # e.g. 14-09-30
          SHORT="${GITHUB_SHA::7}"
          echo "short_sha=$SHORT" >> "$GITHUB_OUTPUT"
          echo "report_dir=html_reports/${GITHUB_ACTOR}/${IST_DATE}/${IST_TIME}/${SHORT}" >> "$GITHUB_OUTPUT"

      - name: Collect commit metadata + diff
        env:
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.sha }}
          BRANCH: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
          SERVER_URL: ${{ github.server_url }}
          REPORT_META: meta.json
        run: python .github/scripts/collect_meta.py

      - name: Generate report HTML
        env:
          # Preferred: subscription auth via the OAuth token from `claude setup-token`.
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Optional fallback: pay-per-call API key. Either (or neither) may be set.
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          MODEL: claude-sonnet-4-6
          REPORT_META: meta.json
          OUTPUT_PATH: ${{ steps.vars.outputs.report_dir }}/index.html
        run: python .github/scripts/generate_report.py

      - name: Commit report into the repo
        env:
          REPORT_DIR: ${{ steps.vars.outputs.report_dir }}
          SHORT_SHA: ${{ steps.vars.outputs.short_sha }}
          BRANCH: ${{ github.ref_name }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "$REPORT_DIR/"
          if git diff --cached --quiet; then
            echo "No report changes to commit."
            exit 0
          fi
          git commit -m "report: ${BRANCH}@${SHORT_SHA} [skip ci]"
          # Push onto the same branch, retrying if it advanced mid-run. Our commit
          # only adds files under a unique <actor>/<sha>/ dir, so rebase won't conflict.
          for i in 1 2 3; do
            git fetch origin "$BRANCH"
            git rebase "origin/$BRANCH" || git rebase --abort
            if git push origin "HEAD:$BRANCH"; then
              echo "Pushed report to $BRANCH."
              exit 0
            fi
            echo "Push attempt $i failed; retrying..."
            sleep 3
          done
          echo "::error::Failed to push report after 3 attempts."
          exit 1
